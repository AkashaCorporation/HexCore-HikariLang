[package]
name = "hikari-lang"
version = "0.1.0"
edition = "2021"
description = "HikariScript — binary analysis workflow language for HexCore"
authors = ["HikariSystem Team"]

[[bin]]
name = "hkl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
